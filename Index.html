<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Cierres de Salas</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }
        .card {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        h1, h2 { color: #0056b3; font-size: 24px; margin-top: 0; }
        .control-group {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            background: #f8f9fa;
            padding: 15px;
            border-radius: 6px;
            border: 1px solid #ddd;
        }
        .control-item {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-width: 150px;
        }
        label { font-weight: bold; margin-bottom: 5px; font-size: 14px; }
        input, select {
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 15px;
        }
        button {
            background-color: #0056b3;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: 0.2s;
        }
        button:hover { background-color: #004494; }
        .btn-print { background-color: #28a745; width: 100%; margin-top: 10px;}
        .btn-print:hover { background-color: #218838; }
        
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: center;
        }
        th { background-color: #e9ecef; }
    </style>
</head>
<body>

    <div class="card">
        <h1>Control de Horarios de Salida</h1>
        
        <div class="control-group">
            <div class="control-item">
                <label>Título del día</label>
                <input type="text" id="dayTitle" value="MARTES :)" placeholder="Ej. MARTES :)">
            </div>
            <div class="control-item">
                <label>Mostrar desde Sala</label>
                <input type="number" id="minRoom" value="1" min="1" max="16">
            </div>
            <div class="control-item">
                <label>Ajuste de tiempo (Minutos)</label>
                <input type="number" id="timeOffset" value="0" placeholder="Ej. 10 o -5">
                <small style="color: #666; font-size: 12px; margin-top: 4px;">Usa negativos para restar tiempo.</small>
            </div>
        </div>

        <button onclick="updateTable()">Aplicar Filtros y Actualizar Lista</button>
        <button onclick="generatePDF()" class="btn-print">Imprimir Formato Doble (PDF)</button>
    </div>

    <div class="card">
        <h2>Vista Previa de Datos</h2>
        <table id="dataTable">
            <thead>
                <tr>
                    <th>Hora (Ajustada)</th>
                    <th>Sala</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <!-- Se llena con JS -->
            </tbody>
        </table>
    </div>

    <script>
        // Datos extraídos directamente de los diagramas (Salas 1 a 16)
        const rawData = [
            {time: '18:14', room: 1}, {time: '20:19', room: 1}, {time: '22:25', room: 1}, {time: '00:25', room: 1},
            {time: '17:30', room: 2}, {time: '19:50', room: 2}, {time: '23:20', room: 2},
            {time: '16:21', room: 3}, {time: '18:41', room: 3}, {time: '21:06', room: 3}, {time: '23:36', room: 3},
            {time: '18:58', room: 4}, {time: '22:15', room: 4}, {time: '00:39', room: 4},
            {time: '18:54', room: 5}, {time: '21:25', room: 5}, {time: '00:09', room: 5},
            {time: '18:27', room: 6}, {time: '21:27', room: 6}, {time: '23:56', room: 6},
            {time: '17:42', room: 7}, {time: '20:47', room: 7}, {time: '00:11', room: 7},
            {time: '17:15', room: 8}, {time: '19:57', room: 8}, {time: '22:55', room: 8},
            {time: '16:47', room: 9}, {time: '19:17', room: 9}, {time: '21:32', room: 9}, {time: '23:52', room: 9},
            {time: '17:45', room: 10}, {time: '20:12', room: 10}, {time: '22:45', room: 10},
            {time: '18:31', room: 11}, {time: '21:17', room: 11}, {time: '23:51', room: 11},
            {time: '17:55', room: 12}, {time: '20:14', room: 12}, {time: '23:08', room: 12},
            {time: '16:24', room: 13}, {time: '19:55', room: 13}, {time: '21:35', room: 13}, {time: '23:45', room: 13},
            {time: '18:57', room: 14}, {time: '22:17', room: 14}, {time: '00:37', room: 14},
            {time: '19:27', room: 15}, {time: '21:54', room: 15}, {time: '00:29', room: 15},
            {time: '17:23', room: 16}, {time: '19:52', room: 16}, {time: '22:07', room: 16}, {time: '01:05', room: 16}
        ];

        let processedData = [];

        // Función para sumar/restar minutos y manejar el formato de 24h a 12h
        function modifyTime(timeStr, offsetMinutes) {
            let [hours, minutes] = timeStr.split(':').map(Number);
            
            // Convertir a minutos totales desde inicio del día (ajuste para madrugada)
            let totalMinutes = hours * 60 + minutes;
            if (hours >= 0 && hours <= 3) totalMinutes += 24 * 60; // Tratar madrugada como fin del día
            
            totalMinutes += parseInt(offsetMinutes) || 0;
            
            let newHours = Math.floor(totalMinutes / 60) % 24;
            let newMinutes = totalMinutes % 60;
            
            // Guardamos el valor numérico para ordenar correctamente
            let sortValue = (newHours >= 0 && newHours <= 3) ? newHours + 24 : newHours;
            sortValue = sortValue * 60 + newMinutes;

            // Formato 12h AM/PM
            const ampm = newHours >= 12 ? 'PM' : 'AM';
            let formattedHours = newHours % 12;
            formattedHours = formattedHours ? formattedHours : 12; 
            let formattedMinutes = newMinutes < 10 ? '0' + newMinutes : newMinutes;
            
            return {
                display: `${formattedHours}:${formattedMinutes} ${ampm}`,
                sortValue: sortValue
            };
        }

        function updateTable() {
            const minRoom = parseInt(document.getElementById('minRoom').value) || 1;
            const timeOffset = parseInt(document.getElementById('timeOffset').value) || 0;
            
            // 1. Filtrar por sala
            let filtered = rawData.filter(d => d.room >= minRoom);
            
            // 2. Modificar tiempo y preparar para ordenar
            processedData = filtered.map(d => {
                let timeObj = modifyTime(d.time, timeOffset);
                return {
                    original: d.time,
                    displayTime: timeObj.display,
                    sortValue: timeObj.sortValue,
                    room: d.room
                };
            });
            
            // 3. Ordenar cronológicamente
            processedData.sort((a, b) => a.sortValue - b.sortValue);
            
            // 4. Mostrar en pantalla
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';
            processedData.forEach(d => {
                tbody.innerHTML += `<tr><td>${d.displayTime}</td><td><b>${d.room}</b></td></tr>`;
            });
        }

        function generatePDF() {
            if (processedData.length === 0) updateTable();

            const { jsPDF } = window.jspdf;
            // Hoja tamaño carta, orientación Horizontal (Landscape) para emular la imagen de referencia
            const doc = new jsPDF({ orientation: 'l', unit: 'mm', format: 'letter' });
            
            const title = document.getElementById('dayTitle').value || 'MARTES :)';
            
            // Dividir los datos en dos mitades para las dos columnas internas de CADA copia
            const half = Math.ceil(processedData.length / 2);
            const dataCol1 = processedData.slice(0, half).map(d => [d.displayTime, d.room]);
            const dataCol2 = processedData.slice(half).map(d => [d.displayTime, d.room]);

            const tableStyles = {
                theme: 'grid',
                head: [], 
                styles: {
                    font: 'helvetica',
                    fontSize: 11,
                    textColor: [0, 0, 0],
                    lineColor: [0, 0, 0],
                    lineWidth: 0.3,
                    valign: 'middle',
                    cellPadding: { top: 2, right: 3, bottom: 2, left: 3 }
                },
                columnStyles: {
                    0: { halign: 'left', cellWidth: 28 },
                    1: { halign: 'right', cellWidth: 15, fontStyle: 'bold' } 
                }
            };

            // Función para dibujar una de las dos "mitades" de la hoja
            function drawBlock(startX) {
                // Dibujar encabezado con estilo de caja recortada
                doc.setLineWidth(0.5);
                doc.rect(startX, 15, 100, 8); 
                doc.setFontSize(12);
                doc.text(`♡      ${title}`, startX + 50, 20.5, { align: "center" });
                
                // Líneas decorativas en las esquinas simulando los dobleces de la imagen
                doc.line(startX, 15, startX + 5, 10);
                doc.line(startX + 100, 15, startX + 95, 10);

                // Columna interna 1
                if (dataCol1.length > 0) {
                    doc.autoTable({
                        ...tableStyles,
                        body: dataCol1,
                        startY: 28,
                        margin: { left: startX }
                    });
                    const table1Height = doc.lastAutoTable.finalY - 28;
                    doc.setLineWidth(0.8); 
                    doc.rect(startX, 28, 43, table1Height); // Borde exterior grueso col 1
                }

                // Columna interna 2
                if (dataCol2.length > 0) {
                    doc.autoTable({
                        ...tableStyles,
                        body: dataCol2,
                        startY: 28,
                        margin: { left: startX + 48 } // Espacio entre las dos columnas
                    });
                    const table2Height = doc.lastAutoTable.finalY - 28;
                    doc.setLineWidth(0.8);
                    doc.rect(startX + 48, 28, 43, table2Height); // Borde exterior grueso col 2
                }
            }

            // Dibujar la copia de la IZQUIERDA
            drawBlock(15); 
            
            // Dibujar la copia de la DERECHA (idéntica)
            drawBlock(155);

            doc.save("horarios_salidas.pdf");
        }

        // Inicializar tabla al cargar la página
        window.onload = updateTable;
    </script>
</body>
</html>
