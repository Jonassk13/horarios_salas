<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Cierres de Salas</title>
    
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }
        .card {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        h1, h2 { color: #0056b3; font-size: 24px; margin-top: 0; }
        .control-group {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            background: #f8f9fa;
            padding: 15px;
            border-radius: 6px;
            border: 1px solid #ddd;
        }
        .control-item {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-width: 150px;
        }
        label { font-weight: bold; margin-bottom: 5px; font-size: 14px; }
        input, select {
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 15px;
        }
        button {
            background-color: #0056b3;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: 0.2s;
        }
        button:hover { background-color: #004494; }
        button:disabled { background-color: #ccc; cursor: not-allowed; }
        .btn-print { background-color: #28a745; width: 100%; margin-top: 10px;}
        .btn-print:hover { background-color: #218838; }
        #status { margin-top: 10px; font-weight: bold; color: #d9534f; }
        
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: center;
        }
        th { background-color: #e9ecef; }
        input.edit-input {
            width: 100%;
            border: none;
            background: transparent;
            font-size: 15px;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Control de Horarios de Salida</h1>
        
        <div class="control-group">
            <div class="control-item" style="flex: 100%;">
                <label>1. Sube las imágenes de las funciones (puedes seleccionar varias)</label>
                <input type="file" id="imageInput" accept="image/*" multiple>
            </div>
            <div class="control-item">
                <label>Título del día</label>
                <input type="text" id="dayTitle" value="MARTES :)" placeholder="Ej. MARTES :)">
            </div>
            <div class="control-item">
                <label>Ajuste de tiempo (Minutos)</label>
                <input type="number" id="timeOffset" value="0" placeholder="Ej. 10 o -5">
                <small style="color: #666; font-size: 12px; margin-top: 4px;">Se aplicará al extraer las horas.</small>
            </div>
            <div class="control-item">
                <label>Imprimir desde Sala</label>
                <input type="number" id="minRoom" value="1" min="1" max="16">
            </div>
        </div>

        <button id="processBtn" onclick="processImages()">Extraer Horarios de Imágenes</button>
        <div id="status"></div>
    </div>

    <div class="card" id="editorSection" style="display: none;">
        <h2>2. Verifica, Asigna Salas y Corrige</h2>
        <p><i>Asigna la sala correspondiente a cada horario. El filtro de "Imprimir desde Sala" se aplicará al generar el PDF.</i></p>
        
        <table id="dataTable">
            <thead>
                <tr>
                    <th>Hora (Ya ajustada)</th>
                    <th>Sala (Ingresa el número)</th>
                    <th>Acción</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <!-- Se llena con JS -->
            </tbody>
        </table>
        
        <div style="margin-top: 15px; display: flex; gap: 10px;">
            <button onclick="addRow('', '')">+ Agregar Fila Manual</button>
        </div>
        <button onclick="generatePDF()" class="btn-print">Imprimir Formato Doble (PDF)</button>
    </div>

    <script>
        async function processImages() {
            const input = document.getElementById('imageInput');
            const statusDiv = document.getElementById('status');
            const processBtn = document.getElementById('processBtn');
            const offsetMinutes = parseInt(document.getElementById('timeOffset').value) || 0;

            if (!input.files || input.files.length === 0) {
                alert("Por favor selecciona al menos una imagen.");
                return;
            }

            statusDiv.innerText = `Analizando ${input.files.length} imagen(es)... esto tomará unos segundos.`;
            processBtn.disabled = true;

            try {
                let allExtractedTimes = [];

                // Leer todas las imágenes seleccionadas
                for (let i = 0; i < input.files.length; i++) {
                    const file = input.files[i];
                    const { data: { text } } = await Tesseract.recognize(file, 'spa');
                    
                    // Buscar patrones de hora HH:MM (24 horas)
                    const timeRegex = /([0-1]?[0-9]|2[0-3]):[0-5][0-9]/g;
                    let foundTimes = text.match(timeRegex) || [];
                    allExtractedTimes.push(...foundTimes);
                }
                
                document.getElementById('tableBody').innerHTML = '';
                
                if(allExtractedTimes.length === 0) {
                    statusDiv.innerText = "No se detectaron horas claras. Por favor ingresa los datos manualmente.";
                    addRow("10:00 PM", "");
                } else {
                    statusDiv.innerText = "Análisis completado. Por favor, asigna el número de sala a cada hora.";
                    
                    // Procesar, aplicar ajuste de minutos y ordenar
                    let processedTimes = allExtractedTimes.map(timeStr => modifyTime(timeStr, offsetMinutes));
                    processedTimes.sort((a, b) => a.sortValue - b.sortValue);

                    processedTimes.forEach(timeObj => {
                        addRow(timeObj.display, ""); 
                    });
                }

                document.getElementById('editorSection').style.display = 'block';

            } catch (error) {
                console.error(error);
                statusDiv.innerText = "Hubo un error al procesar las imágenes.";
            } finally {
                processBtn.disabled = false;
            }
        }

        // Función para aplicar ajuste de tiempo y convertir a 12 horas AM/PM
        function modifyTime(timeStr, offsetMinutes) {
            let [hours, minutes] = timeStr.split(':').map(Number);
            
            let totalMinutes = hours * 60 + minutes;
            if (hours >= 0 && hours <= 3) totalMinutes += 24 * 60; // Tratar madrugada como fin del día
            
            totalMinutes += offsetMinutes;
            
            let newHours = Math.floor(totalMinutes / 60) % 24;
            let newMinutes = (totalMinutes % 60 + 60) % 60; // Manejo de minutos negativos
            if (totalMinutes < 0) newHours = (newHours + 24) % 24;

            let sortValue = (newHours >= 0 && newHours <= 3) ? newHours + 24 : newHours;
            sortValue = sortValue * 60 + newMinutes;

            const ampm = newHours >= 12 ? 'PM' : 'AM';
            let formattedHours = newHours % 12;
            formattedHours = formattedHours ? formattedHours : 12; 
            let formattedMinutes = newMinutes < 10 ? '0' + newMinutes : newMinutes;
            
            return {
                display: `${formattedHours}:${formattedMinutes} ${ampm}`,
                sortValue: sortValue
            };
        }

        function addRow(time, room) {
            const tbody = document.getElementById('tableBody');
            const tr = document.createElement('tr');
            
            tr.innerHTML = `
                <td><input type="text" class="edit-input time-input" value="${time}" placeholder="Ej. 10:00 PM"></td>
                <td><input type="number" class="edit-input room-input" value="${room}" placeholder="Número de Sala"></td>
                <td><button onclick="this.parentElement.parentElement.remove()" style="background-color: #dc3545; padding: 5px 10px;">X</button></td>
            `;
            tbody.appendChild(tr);
        }

        function generatePDF() {
            const minRoom = parseInt(document.getElementById('minRoom').value) || 1;
            
            const times = document.querySelectorAll('.time-input');
            const rooms = document.querySelectorAll('.room-input');
            
            let validData = [];
            for (let i = 0; i < times.length; i++) {
                let roomNum = parseInt(rooms[i].value);
                // Filtrar solo las salas que cumplen con el número mínimo y no están vacías
                if (times[i].value.trim() !== "" && !isNaN(roomNum) && roomNum >= minRoom) {
                    validData.push([times[i].value, roomNum]);
                }
            }

            if(validData.length === 0) {
                alert("No hay datos válidos para imprimir o ninguna sala cumple con el filtro.");
                return;
            }

            const { jsPDF } = window.jspdf;
            const doc = new jsPDF({ orientation: 'l', unit: 'mm', format: 'letter' });
            const title = document.getElementById('dayTitle').value || 'MARTES :)';
            
            const half = Math.ceil(validData.length / 2);
            const dataCol1 = validData.slice(0, half);
            const dataCol2 = validData.slice(half);

            const tableStyles = {
                theme: 'grid',
                head: [], 
                styles: {
                    font: 'helvetica',
                    fontSize: 11,
                    textColor: [0, 0, 0],
                    lineColor: [0, 0, 0],
                    lineWidth: 0.3,
                    valign: 'middle',
                    cellPadding: { top: 2, right: 3, bottom: 2, left: 3 }
                },
                columnStyles: {
                    0: { halign: 'left', cellWidth: 28 },
                    1: { halign: 'right', cellWidth: 15, fontStyle: 'bold' } 
                }
            };

            function drawBlock(startX) {
                doc.setLineWidth(0.5);
                doc.rect(startX, 15, 100, 8); 
                doc.setFontSize(12);
                doc.text(`♡      ${title}`, startX + 50, 20.5, { align: "center" });
                
                doc.line(startX, 15, startX + 5, 10);
                doc.line(startX + 100, 15, startX + 95, 10);

                if (dataCol1.length > 0) {
                    doc.autoTable({
                        ...tableStyles,
                        body: dataCol1,
                        startY: 28,
                        margin: { left: startX }
                    });
                    const table1Height = doc.lastAutoTable.finalY - 28;
                    doc.setLineWidth(0.8); 
                    doc.rect(startX, 28, 43, table1Height);
                }

                if (dataCol2.length > 0) {
                    doc.autoTable({
                        ...tableStyles,
                        body: dataCol2,
                        startY: 28,
                        margin: { left: startX + 48 } 
                    });
                    const table2Height = doc.lastAutoTable.finalY - 28;
                    doc.setLineWidth(0.8);
                    doc.rect(startX + 48, 28, 43, table2Height);
                }
            }

            drawBlock(15); 
            drawBlock(155);

            doc.save("horarios_salidas_final.pdf");
        }
    </script>
</body>
</html>
