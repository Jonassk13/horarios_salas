<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Cierres de Salas (Versión Exacta)</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }
        .card {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        h1, h2 { color: #0056b3; font-size: 22px; margin-top: 0; }
        .control-group {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            background: #f8f9fa;
            padding: 15px;
            border-radius: 6px;
            border: 1px solid #ddd;
        }
        .control-item {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-width: 160px;
        }
        label { font-weight: bold; margin-bottom: 5px; font-size: 13px; }
        input, select {
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
            background: #fff;
        }
        button {
            background-color: #0056b3;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
            transition: 0.2s;
        }
        button:hover { background-color: #004494; }
        .btn-print { background-color: #28a745; width: 100%; margin-top: 10px;}
        .btn-print:hover { background-color: #218838; }
        #status { margin-top: 10px; font-weight: bold; color: #d9534f; }
        
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 6px;
            text-align: center;
        }
        th { background-color: #e9ecef; }
        input.edit-input {
            width: 100%;
            border: none;
            background: transparent;
            font-size: 14px;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Generador de Horarios Exactos (Excel)</h1>
        
        <div class="control-group">
            <div class="control-item" style="flex: 100%;">
                <label>1. Carga el archivo de Excel</label>
                <input type="file" id="excelInput" accept=".xlsx, .xls">
            </div>
            <div class="control-item">
                <label>Título del día</label>
                <input type="text" id="dayTitle" value="MARTES :)" placeholder="Ej. MARTES :)">
            </div>
            <div class="control-item">
                <label>Tomar horario de:</label>
                <select id="timeField">
                    <option value="CREDITS_TIME">Inicio de Créditos</option>
                    <option value="END_TIME">Fin de Función</option>
                </select>
            </div>
            <div class="control-item">
                <label>Filtrar desde la hora:</label>
                <input type="time" id="startTimeFilter" value="15:30">
            </div>
            <div class="control-item">
                <label>Ajuste tiempo (Min)</label>
                <input type="number" id="timeOffset" value="0" placeholder="Ej. 10">
            </div>
            <div class="control-item">
                <label>Desde Sala</label>
                <input type="number" id="minRoom" value="1" min="1" max="16">
            </div>
        </div>

        <button onclick="processExcel()">Extraer Horarios</button>
        <div id="status"></div>
    </div>

    <div class="card" id="editorSection" style="display: none;">
        <h2>2. Vista Previa</h2>
        
        <table id="dataTable">
            <thead>
                <tr>
                    <th>Hora</th>
                    <th>Sala</th>
                    <th>Acción</th>
                </tr>
            </thead>
            <tbody id="tableBody">
            </tbody>
        </table>
        
        <button onclick="addRow('', '')" style="margin-top: 10px;">+ Agregar Fila Manual</button>
        <button onclick="generatePDF()" class="btn-print">Imprimir Formato Doble (PDF)</button>
    </div>

    <script>
        function processExcel() {
            const input = document.getElementById('excelInput');
            const timeField = document.getElementById('timeField').value;
            const offsetMinutes = parseInt(document.getElementById('timeOffset').value) || 0;
            const startTimeStr = document.getElementById('startTimeFilter').value; // Ej: "15:30"
            const statusDiv = document.getElementById('status');

            if (!input.files || input.files.length === 0) {
                alert("Por favor selecciona tu archivo de Excel.");
                return;
            }

            // Convertir la hora de inicio a minutos para el filtro
            let minStartMinutes = 0;
            if (startTimeStr) {
                let parts = startTimeStr.split(':');
                minStartMinutes = parseInt(parts[0]) * 60 + parseInt(parts[1]);
            }

            statusDiv.innerText = "Procesando...";
            const file = input.files[0];
            const reader = new FileReader();

            reader.onload = function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, {type: 'array', cellDates: true});
                    const sheetName = workbook.SheetNames[0];
                    const worksheet = workbook.Sheets[sheetName];
                    const json = XLSX.utils.sheet_to_json(worksheet);
                    
                    let processedData = [];

                    json.forEach(row => {
                        let auditorium = row['AUDITORIUM'];
                        let timeVal = row[timeField];

                        if (auditorium && timeVal) {
                            let roomMatch = String(auditorium).match(/\d+/);
                            let roomNum = roomMatch ? roomMatch[0] : auditorium;
                            let timeObj = modifyTime(timeVal, offsetMinutes);
                            
                            if (timeObj) {
                                // Aplicar el filtro de hora (si sortValue es mayor o igual a minStartMinutes)
                                // Nota: Las horas de madrugada (0-3 AM) tienen sortValue > 1440, por lo que siempre pasarán el filtro de 15:30.
                                if (timeObj.sortValue >= minStartMinutes) {
                                    processedData.push({
                                        displayTime: timeObj.display,
                                        sortValue: timeObj.sortValue,
                                        room: roomNum
                                    });
                                }
                            }
                        }
                    });

                    if (processedData.length === 0) {
                        statusDiv.innerText = `No se encontraron datos después de las ${startTimeStr}.`;
                        return;
                    }

                    processedData.sort((a, b) => a.sortValue - b.sortValue);
                    document.getElementById('tableBody').innerHTML = '';
                    processedData.forEach(d => {
                        addRow(d.displayTime, d.room);
                    });

                    statusDiv.innerText = "¡Datos extraídos y filtrados con éxito!";
                    document.getElementById('editorSection').style.display = 'block';

                } catch (error) {
                    console.error(error);
                    statusDiv.innerText = "Hubo un error al leer el archivo Excel.";
                }
            };
            reader.readAsArrayBuffer(file);
        }

        function modifyTime(timeVal, offsetMinutes) {
            let date = (timeVal instanceof Date) ? timeVal : new Date(timeVal);
            if (isNaN(date.getTime())) return null; 
            
            date.setMinutes(date.getMinutes() + offsetMinutes);

            let hours = date.getHours();
            let minutes = date.getMinutes();
            let sortValue = (hours >= 0 && hours <= 3) ? hours + 24 : hours;
            sortValue = sortValue * 60 + minutes;

            const ampm = hours >= 12 ? 'PM' : 'AM';
            let formattedHours = hours % 12;
            formattedHours = formattedHours ? formattedHours : 12; 
            let formattedMinutes = minutes < 10 ? '0' + minutes : minutes;
            
            return {
                display: `${formattedHours}:${formattedMinutes} ${ampm}`,
                sortValue: sortValue
            };
        }

        function addRow(time, room) {
            const tbody = document.getElementById('tableBody');
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td><input type="text" class="edit-input time-input" value="${time}"></td>
                <td><input type="number" class="edit-input room-input" value="${room}"></td>
                <td><button onclick="this.parentElement.parentElement.remove()" style="background-color: #dc3545; padding: 5px 10px;">X</button></td>
            `;
            tbody.appendChild(tr);
        }

        function generatePDF() {
            const minRoom = parseInt(document.getElementById('minRoom').value) || 1;
            const times = document.querySelectorAll('.time-input');
            const rooms = document.querySelectorAll('.room-input');
            
            let validData = [];
            for (let i = 0; i < times.length; i++) {
                let roomNum = parseInt(rooms[i].value);
                if (times[i].value.trim() !== "" && !isNaN(roomNum) && roomNum >= minRoom) {
                    validData.push([times[i].value, roomNum]);
                }
            }

            if(validData.length === 0) {
                alert("No hay datos válidos para imprimir.");
                return;
            }

            const { jsPDF } = window.jspdf;
            const doc = new jsPDF({ orientation: 'l', unit: 'mm', format: 'letter' });
            const title = document.getElementById('dayTitle').value || 'MARTES :)';
            
            const half = Math.ceil(validData.length / 2);
            const dataCol1 = validData.slice(0, half);
            const dataCol2 = validData.slice(half);

            // Configuraciones de Dibujo Manual (Sin usar AutoTable)
            const col1Width = 35;
            const col2Width = 15;
            const rowHeight = 7; 
            const totalWidth = col1Width + col2Width;

            function drawBlock(startX, dataCol) {
                let currentY = 15;

                // 1. Dibujar el Trapecio del Encabezado (Idéntico a la imagen)
                doc.setLineWidth(0.5);
                doc.line(startX + 4, currentY, startX + totalWidth - 4, currentY); // Línea superior
                doc.line(startX + 4, currentY, startX, currentY + 6); // Diagonal Izquierda
                doc.line(startX + totalWidth - 4, currentY, startX + totalWidth, currentY + 6); // Diagonal Derecha
                doc.line(startX, currentY + 6, startX + totalWidth, currentY + 6); // Línea inferior

                doc.setFont("helvetica", "normal");
                doc.setFontSize(10);
                doc.text(title, startX + (totalWidth / 2), currentY + 4, { align: "center" });

                // 2. Dibujar las filas
                currentY += 12; // Espacio entre encabezado y tabla
                const tableStartY = currentY;

                doc.setLineWidth(0.3); // Grosor de las líneas internas

                for (let i = 0; i < dataCol.length; i++) {
                    let y = currentY + (i * rowHeight);
                    
                    // Celdas internas
                    doc.rect(startX, y, col1Width, rowHeight); // Celda Hora
                    doc.rect(startX + col1Width, y, col2Width, rowHeight); // Celda Sala
                    
                    // Textos
                    doc.setFont("helvetica", "normal");
                    doc.text(dataCol[i][0], startX + 3, y + 5); // Escribir Hora
                    
                    doc.setFont("helvetica", "bold");
                    doc.text(dataCol[i][1].toString(), startX + col1Width + (col2Width / 2), y + 5, { align: "center" }); // Escribir Sala
                }

                // 3. Dibujar Borde Exterior Grueso
                const tableHeight = dataCol.length * rowHeight;
                doc.setLineWidth(1.0); // Borde grueso
                doc.rect(startX, tableStartY, totalWidth, tableHeight);

                // Dibujar el detalle del doblez en la esquina inferior derecha
                const corner = 4;
                doc.setDrawColor(255, 255, 255); // Usar blanco para borrar la esquina
                doc.line(startX + totalWidth - corner, tableStartY + tableHeight, startX + totalWidth, tableStartY + tableHeight);
                doc.line(startX + totalWidth, tableStartY + tableHeight - corner, startX + totalWidth, tableStartY + tableHeight);
                
                doc.setDrawColor(0, 0, 0); // Regresar a negro
                doc.setLineWidth(1.0);
                doc.line(startX + totalWidth - corner, tableStartY + tableHeight, startX + totalWidth, tableStartY + tableHeight - corner); // Corte en diagonal

                doc.setLineWidth(0.3);
                doc.line(startX + totalWidth - corner, tableStartY + tableHeight, startX + totalWidth - corner, tableStartY + tableHeight - corner);
                doc.line(startX + totalWidth - corner, tableStartY + tableHeight - corner, startX + totalWidth, tableStartY + tableHeight - corner);
            }

            // Dibuja las dos copias idénticas
            drawBlock(25, dataCol1); 
            drawBlock(145, dataCol2);

            doc.save("horarios_exactos.pdf");
        }
    </script>
</body>
</html>
