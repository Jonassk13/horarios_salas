<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Módulo de Cierres Híbrido (PDF + Excel)</title>
    
    <!-- Librerías: Excel, PDF.js y Generador de PDFs -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; color: #333; max-width: 1000px; margin: 0 auto; padding: 20px; }
        .card { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; }
        h1, h2 { color: #0056b3; font-size: 22px; margin-top: 0; }
        .top-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; background: #e9ecef; padding: 15px; border-radius: 8px; border: 1px solid #ced4da; }
        .control-group { display: flex; gap: 15px; margin-bottom: 20px; flex-wrap: wrap; background: #f8f9fa; padding: 15px; border-radius: 6px; border: 1px solid #ddd; }
        .control-item { display: flex; flex-direction: column; flex: 1; min-width: 170px; }
        label { font-weight: bold; margin-bottom: 5px; font-size: 13px; }
        input, select { padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; background: #fff; }
        button { background-color: #0056b3; color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; font-size: 15px; font-weight: bold; transition: 0.2s; flex: 1; min-width: 150px; }
        button:hover { background-color: #004494; }
        .btn-success { background-color: #28a745; }
        .btn-success:hover { background-color: #218838; }
        .btn-warning { background-color: #ffc107; color: #000; }
        .btn-warning:hover { background-color: #e0a800; }
        .btn-danger { background-color: #dc3545; }
        .btn-danger:hover { background-color: #c82333; }
        #status { margin-bottom: 15px; font-weight: bold; color: #d9534f; text-align: center; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #ddd; padding: 6px; text-align: center; }
        th { background-color: #e9ecef; }
        input.edit-input { width: 100%; border: none; background: transparent; font-size: 14px; text-align: center; }
        .alt-box { background: #eef2f5; border: 1px solid #c8d4dd; padding: 15px; border-radius: 6px; margin-top: 10px; }
        .db-list { list-style: none; padding: 0; }
        .db-item { background: #f8f9fa; border: 1px solid #ddd; padding: 10px 15px; margin-bottom: 8px; border-radius: 5px; display: flex; justify-content: space-between; align-items: center; }
    </style>
</head>
<body>

    <div class="card">
        <h1>Control Operativo (Sincronización PDF + Excel)</h1>
        
        <!-- BOTONES DE ACCIÓN PRINCIPALES -->
        <div class="top-actions">
            <button onclick="processFiles()">1. Sincronizar y Extraer</button>
            <button onclick="addRow('', '', '', '')">+ Fila Manual</button>
            <button onclick="saveScheduleToDB()" class="btn-warning">Guardar en Historial</button>
            <button onclick="generatePDF()" class="btn-success">Imprimir Formato PDF</button>
        </div>

        <div id="status"></div>
        
        <!-- CONFIGURACIÓN DE ARCHIVOS -->
        <div class="control-group">
            <div class="control-item" style="flex: 100%;">
                <label>1. Cargar Archivo PDF (Programación Oficial)</label>
                <input type="file" id="pdfInput" accept=".pdf">
            </div>
            <div class="control-item" style="flex: 100%;">
                <label>2. Cargar Archivos Excel/CSV/TSV (Para extraer duración. ¡Puedes subir los 3 a la vez!)</label>
                <input type="file" id="excelInput" accept=".xlsx, .xls, .csv, .tsv" multiple>
            </div>
            
            <div class="control-item">
                <label>Título del día</label>
                <input type="text" id="dayTitle" value="MARTES :)" placeholder="Ej. MARTES :)">
            </div>
            <div class="control-item">
                <label>Filtro: Cierres desde (24h):</label>
                <input type="time" id="startTimeFilter" value="">
            </div>
            <div class="control-item">
                <label>Ajuste tiempo Salida (Min)</label>
                <input type="number" id="timeOffset" value="0">
            </div>
        </div>

        <!-- CONFIGURACIÓN DE ALTERNANCIA -->
        <div class="alt-box">
            <h3 style="margin-top: 0; font-size: 16px; color: #0056b3;">Reglas de Asignación (Salas / Casetas)</h3>
            <div style="display: flex; gap: 15px; flex-wrap: wrap;">
                <div class="control-item">
                    <label>¿Alternar Salas y Casetas?</label>
                    <select id="altMode" onchange="toggleAltSettings()">
                        <option value="none">No alternar</option>
                        <option value="chrono">Sí, Cronológicamente</option>
                        <option value="numeric">Sí, Por número de Sala</option>
                    </select>
                </div>
                <div class="control-item" id="altSettingsBox1" style="display: none;">
                    <label>Empezar con la Sala:</label>
                    <input type="number" id="altStartRoom" value="1" min="1">
                </div>
                <div class="control-item" id="altSettingsBox2" style="display: none;">
                    <label>Esa sala inicial será:</label>
                    <select id="altStartRole">
                        <option value="S">Sala (S)</option>
                        <option value="C">Caseta (C)</option>
                    </select>
                </div>
                <div class="control-item" id="altSettingsBox3" style="display: none;">
                    <label>Casetas empiezan desde las:</label>
                    <input type="time" id="timeCasetasFilter" value="19:00">
                </div>
            </div>
        </div>
    </div>

    <!-- VISTA PREVIA Y EDICIÓN -->
    <div class="card" id="editorSection" style="display: none;">
        <h2 id="editorTitle">Vista Previa y Edición</h2>
        <table id="dataTable">
            <thead>
                <tr>
                    <th>Película</th>
                    <th>Ingreso</th>
                    <th>Salida (Cierre)</th>
                    <th>Sala / Caseta</th>
                    <th>Acción</th>
                </tr>
            </thead>
            <tbody id="tableBody">
            </tbody>
        </table>
    </div>

    <div class="card">
        <h2>Historial de Horarios Guardados (Local)</h2>
        <ul class="db-list" id="savedSchedulesList">
            <li>No hay horarios guardados en el navegador.</li>
        </ul>
    </div>

    <script>
        // Configurar el worker de PDF.js
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

        window.onload = function() {
            renderSavedSchedules();
        };

        function toggleAltSettings() {
            const mode = document.getElementById('altMode').value;
            const displayStyle = (mode !== 'none') ? 'flex' : 'none';
            document.getElementById('altSettingsBox1').style.display = displayStyle;
            document.getElementById('altSettingsBox2').style.display = displayStyle;
            document.getElementById('altSettingsBox3').style.display = displayStyle;
        }

        // LIMPIEZA DE NOMBRES PARA SINCRONIZACIÓN
        function cleanExcelName(name) {
            if (!name) return "";
            return name.split('_')[0].toLowerCase().replace(/[^a-z0-9]/g, '');
        }

        function cleanPdfName(name) {
            if (!name) return "";
            let clean = name.replace(/(Esp|Sub|SP|4DX|3D|SCREENX|SJ|TCF|JR)/gi, '');
            return clean.replace(/[^a-zA-Z0-9]/g, '').toLowerCase();
        }

        // BÚSQUEDA INTELIGENTE
        function findDuration(pdfClean, movieDurations) {
            let keys = Object.keys(movieDurations);
            // 1. Coincidencia directa o interna
            for (let k of keys) {
                if (pdfClean.includes(k) || k.includes(pdfClean)) return movieDurations[k];
            }
            // 2. Coincidencia parcial (Primeras 5 letras)
            let pdfStart = pdfClean.substring(0, 5);
            if (pdfStart.length >= 4) {
                for (let k of keys) {
                    if (k.startsWith(pdfStart)) return movieDurations[k];
                }
            }
            return null; // Si no hay match
        }

        async function processFiles() {
            const pdfInput = document.getElementById('pdfInput');
            const excelInput = document.getElementById('excelInput');
            const offsetMinutes = parseInt(document.getElementById('timeOffset').value) || 0;
            const statusDiv = document.getElementById('status');

            if (!pdfInput.files || pdfInput.files.length === 0) {
                return alert("Debes subir el archivo PDF de la programación.");
            }
            if (!excelInput.files || excelInput.files.length === 0) {
                return alert("Debes subir al menos un archivo Excel/CSV para calcular duraciones.");
            }

            statusDiv.style.color = '#0056b3';
            statusDiv.innerText = "Analizando y sincronizando archivos...";

            try {
                // PASO 1: LEER EXCEL Y CREAR DICCIONARIO DE DURACIONES
                let movieDurations = {}; // Guardará los minutos que dura cada película

                for (let i = 0; i < excelInput.files.length; i++) {
                    const file = excelInput.files[i];
                    const data = new Uint8Array(await file.arrayBuffer());
                    const workbook = XLSX.read(data, {type: 'array', cellDates: true});
                    const sheet = workbook.Sheets[workbook.SheetNames[0]];
                    const json = XLSX.utils.sheet_to_json(sheet);
                    
                    json.forEach(row => {
                        let feature = row['FEATURE'] || row['Pelicula'];
                        let showTime = row['SHOW_TIME'] || row['SCHEDULED_TIME'];
                        let creditsTime = row['CREDITS_TIME'];
                        
                        if (feature && showTime && creditsTime) {
                            let st = getMinutesFromExcel(showTime);
                            let ct = getMinutesFromExcel(creditsTime);
                            if (st !== null && ct !== null) {
                                let duration = ct - st;
                                if (duration < 0) duration += 24 * 60; // Por si cruza la medianoche
                                let key = cleanExcelName(feature);
                                movieDurations[key] = duration;
                            }
                        }
                    });
                }

                // PASO 2: LEER EL PDF Y EXTRAER EL TEXTO CRUDO
                const pdfFile = pdfInput.files[0];
                const pdfArrayBuffer = new Uint8Array(await pdfFile.arrayBuffer());
                const pdf = await pdfjsLib.getDocument({data: pdfArrayBuffer}).promise;
                
                let fullText = "";
                for (let i = 1; i <= pdf.numPages; i++) {
                    const page = await pdf.getPage(i);
                    const content = await page.getTextContent();
                    fullText += content.items.map(item => item.str).join(' ') + ' ';
                }

                // PASO 3: EXTRACCIÓN CON EXPRESIONES REGULARES
                // Busca 4 horas seguidas, un texto (título), un rating opcional, y la SALA
                const regex = /((?:\d{2}:\d{2}[ap]\.?\s*m\.\s*){4})(.*?)\s+(?:AA|A|B15|B|C|S\?)?\s*(SALA\s*\d+|SALA[A-Z\s]*\d+|MXE|SALA\s*JR)/gi;
                let match;
                let rawData = [];

                // Filtros de usuario
                const startTimeStr = document.getElementById('startTimeFilter').value;
                let minStartMinutes = 0;
                if (startTimeStr) {
                    let parts = startTimeStr.split(':');
                    minStartMinutes = parseInt(parts[0]) * 60 + parseInt(parts[1]);
                }
                const altStartRoom = parseInt(document.getElementById('altStartRoom').value) || 1;

                while ((match = regex.exec(fullText)) !== null) {
                    let timesStr = match[1];
                    let title = match[2].trim();
                    let salaStr = match[3].trim();
                    
                    let timeMatches = timesStr.match(/\d{2}:\d{2}[ap]\.?\s*m\./gi);
                    if (timeMatches && timeMatches.length >= 4) {
                        // Según la estructura del PDF:
                        // [0] = Comienzo Película
                        // [1] = Finish (Cierre)
                        // [2] = Comienzo Función (Apertura de Puertas / Ingreso)
                        // [3] = Cleanup Complete
                        let entryTimeRaw = timeMatches[2]; 
                        let fallbackFinishRaw = timeMatches[1]; 
                        
                        let entryParsed = parsePdfTime(entryTimeRaw, 0);
                        
                        // Sincronizar título con el Excel para obtener la duración exacta
                        let cleanTitle = cleanPdfName(title);
                        let duration = findDuration(cleanTitle, movieDurations);
                        
                        let exitParsed;
                        if (duration !== null) {
                            // Sumamos la duración exacta del Excel a la Hora de Ingreso
                            exitParsed = parsePdfTime(entryTimeRaw, duration + offsetMinutes);
                        } else {
                            // Si por algún motivo no la encuentra en los 3 excels, usa la del PDF como respaldo
                            exitParsed = parsePdfTime(fallbackFinishRaw, offsetMinutes);
                        }

                        let roomMatch = salaStr.match(/\d+/);
                        let roomNum = roomMatch ? parseInt(roomMatch[0]) : (salaStr.includes('MXE') ? 7 : 0);

                        if (roomNum >= altStartRoom && exitParsed.sortValue >= minStartMinutes) {
                            rawData.push({
                                movieName: title,
                                entryTime: entryParsed.display,
                                exitTime: exitParsed.display,
                                sortValue: exitParsed.sortValue,
                                roomNum: roomNum
                            });
                        }
                    }
                }

                if (rawData.length === 0) {
                    statusDiv.style.color = '#d9534f';
                    statusDiv.innerText = "No se encontraron funciones que coincidan con los filtros.";
                    return;
                }

                // PASO 4: ORDENAR Y APLICAR ALTERNANCIA
                rawData.sort((a, b) => a.sortValue - b.sortValue);

                const altMode = document.getElementById('altMode').value;
                const altStartRole = document.getElementById('altStartRole').value;
                const timeCasetasStr = document.getElementById('timeCasetasFilter').value;
                let minCasetasMinutes = 0;
                if (timeCasetasStr) {
                    let pC = timeCasetasStr.split(':');
                    minCasetasMinutes = parseInt(pC[0]) * 60 + parseInt(pC[1]);
                }

                if (altMode === 'numeric') {
                    rawData.forEach(d => {
                        let forceSala = minCasetasMinutes > 0 && d.sortValue < minCasetasMinutes;
                        let diff = d.roomNum - altStartRoom;
                        let role = (diff % 2 === 0) ? altStartRole : (altStartRole === 'S' ? 'C' : 'S');
                        d.displayRoom = forceSala ? `S-${d.roomNum}` : `${role}-${d.roomNum}`;
                    });
                } else if (altMode === 'chrono') {
                    let toggle = (altStartRole === 'S'); 
                    let alternatingStarted = false;

                    rawData.forEach(d => {
                        let forceSala = minCasetasMinutes > 0 && d.sortValue < minCasetasMinutes;
                        if (!alternatingStarted && d.roomNum === altStartRoom) alternatingStarted = true;
                        
                        if (alternatingStarted) {
                            let role = toggle ? 'S' : 'C';
                            if (forceSala) {
                                role = 'S';
                            } else {
                                toggle = !toggle; 
                            }
                            d.displayRoom = `${role}-${d.roomNum}`;
                        } else {
                            d.displayRoom = forceSala ? `S-${d.roomNum}` : d.roomNum.toString();
                        }
                    });
                } else {
                    rawData.forEach(d => d.displayRoom = d.roomNum.toString());
                }

                // DIBUJAR TABLA
                document.getElementById('tableBody').innerHTML = '';
                rawData.forEach(d => addRow(d.movieName, d.entryTime, d.exitTime, d.displayRoom));

                statusDiv.style.color = '#28a745';
                statusDiv.innerText = `¡${rawData.length} funciones combinadas y extraídas con éxito!`;
                document.getElementById('editorSection').style.display = 'block';

            } catch (error) {
                console.error(error);
                statusDiv.style.color = '#d9534f';
                statusDiv.innerText = "Error crítico al procesar los archivos. Verifica que sean correctos.";
            }
        }

        // Obtener solo minutos absolutos desde el Excel
        function getMinutesFromExcel(timeVal) {
            let hours = 0, minutes = 0;
            if (timeVal instanceof Date && !isNaN(timeVal.getTime())) {
                hours = timeVal.getHours(); minutes = timeVal.getMinutes();
            } else if (typeof timeVal === 'string' && timeVal.match(/^\d{1,2}:\d{2}/)) {
                let p = timeVal.split(':'); hours = parseInt(p[0]); minutes = parseInt(p[1]);
            } else if (typeof timeVal === 'number') {
                let ts = Math.round(timeVal * 24 * 3600);
                hours = Math.floor(ts / 3600) % 24; minutes = Math.floor((ts % 3600) / 60);
            } else {
                return null;
            }
            return hours * 60 + minutes;
        }

        // Convertir hora tipo "02:44p. m." del PDF a minutos absolutos, sumar duración y formatear a 12h
        function parsePdfTime(timeStr, addMins) {
            let isPM = timeStr.toLowerCase().includes('p');
            let parts = timeStr.match(/\d+/g);
            let hours = parseInt(parts[0]);
            let minutes = parseInt(parts[1]);
            
            if (isPM && hours !== 12) hours += 12;
            if (!isPM && hours === 12) hours = 0;
            
            let totalMins = (hours * 60) + minutes + addMins;
            hours = Math.floor(totalMins / 60) % 24;
            if (hours < 0) hours += 24;
            minutes = totalMins % 60;
            
            let sortValue = (hours >= 0 && hours <= 3) ? hours + 24 : hours;
            sortValue = sortValue * 60 + minutes;
            
            let ampm = hours >= 12 ? 'PM' : 'AM';
            let fHours = hours % 12;
            fHours = fHours ? fHours : 12;
            let fMins = minutes < 10 ? '0' + minutes : minutes;
            
            return {
                display: `${fHours}:${fMins} ${ampm}`,
                sortValue: sortValue
            };
        }

        function addRow(movie, entry, exit, roomStr) {
            const tbody = document.getElementById('tableBody');
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td><input type="text" class="edit-input movie-input" value="${movie}"></td>
                <td><input type="text" class="edit-input entry-input" value="${entry}"></td>
                <td><input type="text" class="edit-input exit-input" value="${exit}"></td>
                <td><input type="text" class="edit-input room-input" value="${roomStr}"></td>
                <td><button onclick="this.parentElement.parentElement.remove()" class="btn-danger" style="padding: 5px 10px;">X</button></td>
            `;
            tbody.appendChild(tr);
        }

        // ==========================================
        // BASE DE DATOS LOCAL
        // ==========================================
        function getDBSchedules() {
            return JSON.parse(localStorage.getItem('cinepolis_schedules_hybrid')) || [];
        }

        function saveScheduleToDB() {
            const title = document.getElementById('dayTitle').value || 'Sin Título';
            const movies = document.querySelectorAll('.movie-input');
            const entries = document.querySelectorAll('.entry-input');
            const exits = document.querySelectorAll('.exit-input');
            const rooms = document.querySelectorAll('.room-input');
            
            let currentData = [];
            for (let i = 0; i < movies.length; i++) {
                if (exits[i].value.trim() !== "" && rooms[i].value.trim() !== "") {
                    currentData.push({
                        movie: movies[i].value,
                        entry: entries[i].value,
                        exit: exits[i].value,
                        room: rooms[i].value 
                    });
                }
            }

            if(currentData.length === 0) return alert("La tabla está vacía.");

            const newRecord = {
                id: Date.now(),
                date: new Date().toLocaleDateString() + ' ' + new Date().toLocaleTimeString(),
                title: title,
                data: currentData
            };

            let db = getDBSchedules();
            db.unshift(newRecord); 
            localStorage.setItem('cinepolis_schedules_hybrid', JSON.stringify(db));
            
            alert("Horario guardado en el historial local.");
            renderSavedSchedules();
        }

        function renderSavedSchedules() {
            const db = getDBSchedules();
            const list = document.getElementById('savedSchedulesList');
            
            if (db.length === 0) {
                list.innerHTML = '<li>No hay horarios guardados.</li>';
                return;
            }

            list.innerHTML = '';
            db.forEach(record => {
                const li = document.createElement('li');
                li.className = 'db-item';
                li.innerHTML = `
                    <div>
                        <strong>${record.title}</strong><br>
                        <small style="color: #666;">Guardado: ${record.date} | ${record.data.length} funciones</small>
                    </div>
                    <div style="display: flex; gap: 5px;">
                        <button onclick="loadSchedule(${record.id})">Cargar a Tabla</button>
                        <button onclick="deleteSchedule(${record.id})" class="btn-danger">Borrar</button>
                    </div>
                `;
                list.appendChild(li);
            });
        }

        function loadSchedule(id) {
            const db = getDBSchedules();
            const record = db.find(r => r.id === id);
            
            if (record) {
                document.getElementById('dayTitle').value = record.title;
                document.getElementById('tableBody').innerHTML = '';
                
                record.data.forEach(d => addRow(d.movie, d.entry, d.exit, d.room));
                
                document.getElementById('editorSection').style.display = 'block';
                window.scrollTo({ top: document.getElementById('editorSection').offsetTop, behavior: 'smooth' });
            }
        }

        function deleteSchedule(id) {
            if(confirm("¿Borrar este horario del historial?")) {
                let db = getDBSchedules();
                db = db.filter(r => r.id !== id);
                localStorage.setItem('cinepolis_schedules_hybrid', JSON.stringify(db));
                renderSavedSchedules();
            }
        }

        // ==========================================
        // IMPRESIÓN DEL PDF EXACTO (4 COLUMNAS)
        // ==========================================
        function generatePDF() {
            const movies = document.querySelectorAll('.movie-input');
            const entries = document.querySelectorAll('.entry-input');
            const exits = document.querySelectorAll('.exit-input');
            const rooms = document.querySelectorAll('.room-input');
            
            let validData = [];
            for (let i = 0; i < movies.length; i++) {
                if (exits[i].value.trim() !== "" && rooms[i].value.trim() !== "") {
                    validData.push({ 
                        movie: movies[i].value.trim(), 
                        entry: entries[i].value.trim(), 
                        exit: exits[i].value.trim(), 
                        room: rooms[i].value.trim() 
                    });
                }
            }

            if(validData.length === 0) return alert("No hay datos válidos para imprimir.");

            const { jsPDF } = window.jspdf;
            const doc = new jsPDF({ orientation: 'l', unit: 'mm', format: 'letter' });
            const title = document.getElementById('dayTitle').value || 'MARTES :)';
            
            const colEntryW = 15;
            const colExitW = 15;
            const colMovieW = 45;
            const colRoomW = 15;
            const totalW = colEntryW + colExitW + colMovieW + colRoomW; // 90mm

            function drawBlock(startX, blockData) {
                let maxRows = blockData.length;
                if (maxRows < 15) maxRows = 15; 
                
                let rowHeight = 5.5; 
                let fontSize = 9;
                
                if (maxRows > 32) {
                    rowHeight = 180 / maxRows; 
                    if(rowHeight < 4) fontSize = 7; 
                    else if (rowHeight < 5) fontSize = 8;
                }

                const currentY = 12;

                doc.setLineWidth(0.4);
                doc.line(startX + 8, currentY, startX + totalW - 8, currentY); 
                doc.line(startX, currentY + 6, startX + totalW, currentY + 6); 
                doc.line(startX + 8, currentY, startX, currentY + 6); 
                doc.line(startX + totalW - 8, currentY, startX + totalW, currentY + 6); 

                doc.setFont("helvetica", "normal");
                doc.setFontSize(10);
                doc.text(`<3       ${title}`, startX + (totalW / 2), currentY + 4.2, { align: "center" });

                const startY = currentY + 8; 

                doc.setFont("helvetica", "bold");
                doc.setFontSize(8);
                doc.text("INGRESO", startX + 1.5, startY - 1);
                doc.text("SALIDA", startX + colEntryW + 2, startY - 1);
                doc.text("PELÍCULA", startX + colEntryW + colExitW + 2, startY - 1);
                doc.text("SALA", startX + colEntryW + colExitW + colMovieW + 3, startY - 1);

                doc.setLineWidth(0.2); 
                
                for (let i = 0; i < maxRows; i++) {
                    let y = startY + (i * rowHeight);
                    
                    doc.rect(startX, y, colEntryW, rowHeight);
                    doc.rect(startX + colEntryW, y, colExitW, rowHeight);
                    doc.rect(startX + colEntryW + colExitW, y, colMovieW, rowHeight);
                    doc.rect(startX + colEntryW + colExitW + colMovieW, y, colRoomW, rowHeight);

                    if (i < blockData.length) {
                        let item = blockData[i];
                        doc.setFont("helvetica", "normal");
                        doc.setFontSize(fontSize);
                        
                        doc.text(item.entry, startX + 1.5, y + (rowHeight * 0.75));
                        doc.text(item.exit, startX + colEntryW + 1.5, y + (rowHeight * 0.75));
                        
                        let mName = item.movie;
                        if(mName.length > 22) mName = mName.substring(0, 20) + "...";
                        doc.text(mName, startX + colEntryW + colExitW + 2, y + (rowHeight * 0.75));
                        
                        doc.setFont("helvetica", "bold");
                        doc.text(item.room.toString(), startX + colEntryW + colExitW + colMovieW + (colRoomW / 2), y + (rowHeight * 0.75), { align: "center" });
                    }
                }

                const h = maxRows * rowHeight;
                const corner = 3.5; 

                doc.setLineWidth(0.8); 
                doc.line(startX, startY, startX + totalW, startY); 
                doc.line(startX, startY, startX, startY + h); 
                doc.line(startX, startY + h, startX + totalW - corner, startY + h); 
                doc.line(startX + totalW, startY, startX + totalW, startY + h - corner); 
                doc.line(startX + totalW - corner, startY + h, startX + totalW, startY + h - corner);

                doc.setLineWidth(0.2);
                doc.line(startX + totalW - corner, startY + h, startX + totalW - corner, startY + h - corner);
                doc.line(startX + totalW - corner, startY + h - corner, startX + totalW, startY + h - corner);
            }

            drawBlock(25, validData);  
            drawBlock(160, validData); 

            doc.save("horarios_funciones_cierres.pdf");
        }
    </script>
</body>
</html>
