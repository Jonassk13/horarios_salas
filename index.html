<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Módulo de Cierres - Sistema de Inventario</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            max-width: 950px;
            margin: 0 auto;
            padding: 20px;
        }
        .card {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        h1, h2 { color: #0056b3; font-size: 22px; margin-top: 0; }
        .control-group {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            background: #f8f9fa;
            padding: 15px;
            border-radius: 6px;
            border: 1px solid #ddd;
        }
        .control-item {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-width: 170px;
        }
        label { font-weight: bold; margin-bottom: 5px; font-size: 13px; }
        input, select {
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
            background: #fff;
        }
        button {
            background-color: #0056b3;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
            transition: 0.2s;
        }
        button:hover { background-color: #004494; }
        .btn-success { background-color: #28a745; }
        .btn-success:hover { background-color: #218838; }
        .btn-warning { background-color: #ffc107; color: #000; }
        .btn-warning:hover { background-color: #e0a800; }
        .btn-danger { background-color: #dc3545; }
        .btn-danger:hover { background-color: #c82333; }
        
        #status { margin-top: 10px; font-weight: bold; color: #d9534f; }
        
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 6px;
            text-align: center;
        }
        th { background-color: #e9ecef; }
        input.edit-input {
            width: 100%;
            border: none;
            background: transparent;
            font-size: 14px;
            text-align: center;
        }
        .alt-box {
            background: #eef2f5;
            border: 1px solid #c8d4dd;
            padding: 10px;
            border-radius: 6px;
            margin-top: 10px;
        }
        .db-list {
            list-style: none;
            padding: 0;
        }
        .db-item {
            background: #f8f9fa;
            border: 1px solid #ddd;
            padding: 10px 15px;
            margin-bottom: 8px;
            border-radius: 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Operaciones: Cierres de Salas</h1>
        
        <div class="control-group">
            <div class="control-item" style="flex: 100%;">
                <label>Cargar Archivo Excel del Sistema</label>
                <input type="file" id="excelInput" accept=".xlsx, .xls">
            </div>
            <div class="control-item">
                <label>Título del día</label>
                <input type="text" id="dayTitle" value="MARTES :)" placeholder="Ej. MARTES :)">
            </div>
            <div class="control-item">
                <label>Tomar horario de:</label>
                <select id="timeField">
                    <option value="CREDITS_TIME">Inicio de Créditos</option>
                    <option value="END_TIME">Fin de Función</option>
                </select>
            </div>
            <div class="control-item">
                <label>Ajuste tiempo (Min)</label>
                <input type="number" id="timeOffset" value="0" placeholder="Ej. 10">
            </div>
            <div class="control-item">
                <label>Desde Sala Mínima</label>
                <input type="number" id="minRoom" value="1" min="1" max="50">
            </div>
        </div>

        <div class="alt-box">
            <div style="display: flex; gap: 15px; flex-wrap: wrap;">
                <div class="control-item">
                    <label>¿Alternar Salas y Casetas (S/C)?</label>
                    <select id="altMode" onchange="toggleAltSettings()">
                        <option value="none">No alternar (Solo números)</option>
                        <option value="chrono">Sí, Cronológicamente</option>
                        <option value="numeric">Sí, Por número de Sala</option>
                    </select>
                </div>
                <div class="control-item" id="altSettingsBox" style="display: none; flex-direction: row; gap: 10px;">
                    <div>
                        <label>A partir de la Sala:</label>
                        <input type="number" id="altStartRoom" value="1" min="1" style="width: 80px;">
                    </div>
                    <div>
                        <label>Esa sala será:</label>
                        <select id="altStartRole">
                            <option value="S">Sala (S)</option>
                            <option value="C">Caseta (C)</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>

        <button onclick="processExcel()" style="margin-top: 15px;">Generar Horarios</button>
        <div id="status"></div>
    </div>

    <!-- Módulo de Base de Datos / Historial -->
    <div class="card">
        <h2>Base de Datos de Horarios Guardados</h2>
        <ul class="db-list" id="savedSchedulesList">
            <li>No hay horarios guardados en el inventario.</li>
        </ul>
    </div>

    <div class="card" id="editorSection" style="display: none;">
        <h2 id="editorTitle">Vista Previa y Edición</h2>
        
        <table id="dataTable">
            <thead>
                <tr>
                    <th>Hora (Espacio para Nombre)</th>
                    <th>Sala / Caseta</th>
                    <th>Acción</th>
                </tr>
            </thead>
            <tbody id="tableBody">
            </tbody>
        </table>
        
        <div style="margin-top: 15px; display: flex; gap: 10px; flex-wrap: wrap;">
            <button onclick="addRow('', '')">+ Agregar Fila Manual</button>
            <button onclick="saveScheduleToDB()" class="btn-warning">Guardar en Base de Datos</button>
            <button onclick="generatePDF()" class="btn-success">Imprimir Formato Doble (PDF)</button>
        </div>
    </div>

    <script>
        // Inicializar la base de datos al cargar la página
        window.onload = function() {
            renderSavedSchedules();
        };

        function toggleAltSettings() {
            const mode = document.getElementById('altMode').value;
            document.getElementById('altSettingsBox').style.display = (mode !== 'none') ? 'flex' : 'none';
        }

        function processExcel() {
            const input = document.getElementById('excelInput');
            const timeField = document.getElementById('timeField').value;
            const offsetMinutes = parseInt(document.getElementById('timeOffset').value) || 0;
            const minRoom = parseInt(document.getElementById('minRoom').value) || 1;
            const statusDiv = document.getElementById('status');

            if (!input.files || input.files.length === 0) {
                alert("Por favor selecciona tu archivo de Excel.");
                return;
            }

            statusDiv.innerText = "Procesando...";
            const file = input.files[0];
            const reader = new FileReader();

            reader.onload = function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, {type: 'array', cellDates: true});
                    const sheetName = workbook.SheetNames[0];
                    const worksheet = workbook.Sheets[sheetName];
                    const json = XLSX.utils.sheet_to_json(worksheet);
                    
                    let rawData = [];

                    json.forEach(row => {
                        let auditorium = row['AUDITORIUM'];
                        let timeVal = row[timeField];

                        if (auditorium && timeVal !== undefined && timeVal !== null) {
                            let roomMatch = String(auditorium).match(/\d+/);
                            let roomNum = roomMatch ? parseInt(roomMatch[0]) : null;
                            
                            if (roomNum !== null && roomNum >= minRoom) {
                                let timeObj = modifyTime(timeVal, offsetMinutes);
                                if (timeObj) {
                                    rawData.push({
                                        displayTime: timeObj.display,
                                        sortValue: timeObj.sortValue,
                                        roomNum: roomNum
                                    });
                                }
                            }
                        }
                    });

                    if (rawData.length === 0) {
                        statusDiv.innerText = "No se encontraron datos válidos.";
                        return;
                    }

                    rawData.sort((a, b) => a.sortValue - b.sortValue);

                    // Alternancia S/C
                    const altMode = document.getElementById('altMode').value;
                    const altStartRoom = parseInt(document.getElementById('altStartRoom').value) || 1;
                    const altStartRole = document.getElementById('altStartRole').value;

                    if (altMode === 'numeric') {
                        rawData.forEach(d => {
                            if (d.roomNum >= altStartRoom) {
                                let diff = d.roomNum - altStartRoom;
                                let role = (diff % 2 === 0) ? altStartRole : (altStartRole === 'S' ? 'C' : 'S');
                                d.displayRoom = `${role}-${d.roomNum}`;
                            } else {
                                d.displayRoom = d.roomNum.toString();
                            }
                        });
                    } else if (altMode === 'chrono') {
                        let toggle = (altStartRole === 'S'); 
                        let alternatingStarted = false;

                        rawData.forEach(d => {
                            if (!alternatingStarted && d.roomNum === altStartRoom) {
                                alternatingStarted = true;
                            }
                            if (alternatingStarted) {
                                d.displayRoom = (toggle ? 'S-' : 'C-') + d.roomNum;
                                toggle = !toggle; 
                            } else {
                                d.displayRoom = d.roomNum.toString();
                            }
                        });
                    } else {
                        rawData.forEach(d => {
                            d.displayRoom = d.roomNum.toString();
                        });
                    }

                    document.getElementById('tableBody').innerHTML = '';
                    rawData.forEach(d => addRow(d.displayTime, d.displayRoom));

                    statusDiv.innerText = "¡Datos extraídos con éxito!";
                    document.getElementById('editorTitle').innerText = "Vista Previa (Nuevo Horario)";
                    document.getElementById('editorSection').style.display = 'block';

                } catch (error) {
                    console.error(error);
                    statusDiv.innerText = "Hubo un error al leer el archivo Excel.";
                }
            };
            reader.readAsArrayBuffer(file);
        }

        // MOTOR DE TIEMPO CON REGLA DE REDONDEO (>25 SEGUNDOS)
        function modifyTime(timeVal, offsetMinutes) {
            let hours = 0, minutes = 0, seconds = 0;

            if (timeVal instanceof Date && !isNaN(timeVal.getTime())) {
                hours = timeVal.getHours();
                minutes = timeVal.getMinutes();
                seconds = timeVal.getSeconds();
            } else if (typeof timeVal === 'string' && timeVal.match(/^\d{1,2}:\d{2}/)) {
                let parts = timeVal.split(':');
                hours = parseInt(parts[0], 10);
                minutes = parseInt(parts[1], 10);
                seconds = parts[2] ? parseInt(parts[2], 10) : 0;
            } else if (typeof timeVal === 'number') {
                let totalSeconds = Math.round(timeVal * 24 * 3600);
                hours = Math.floor(totalSeconds / 3600) % 24;
                minutes = Math.floor((totalSeconds % 3600) / 60);
                seconds = totalSeconds % 60;
            } else {
                let date = new Date(timeVal);
                if (!isNaN(date.getTime())) {
                    hours = date.getHours();
                    minutes = date.getMinutes();
                    seconds = date.getSeconds();
                } else {
                    return null; 
                }
            }

            // Regla de inventario: si los segundos son mayores a 25, sumar 1 minuto
            if (seconds > 25) {
                minutes += 1;
            }

            let totalMinutes = (hours * 60) + minutes + offsetMinutes;
            hours = Math.floor(totalMinutes / 60) % 24;
            if (hours < 0) hours += 24; 
            minutes = ((totalMinutes % 60) + 60) % 60;

            let sortValue = (hours >= 0 && hours <= 3) ? hours + 24 : hours;
            sortValue = sortValue * 60 + minutes;

            const ampm = hours >= 12 ? 'PM' : 'AM';
            let formattedHours = hours % 12;
            formattedHours = formattedHours ? formattedHours : 12; 
            let formattedMinutes = minutes < 10 ? '0' + minutes : minutes;
            
            return {
                display: `${formattedHours}:${formattedMinutes} ${ampm}`,
                sortValue: sortValue
            };
        }

        function addRow(time, roomStr) {
            const tbody = document.getElementById('tableBody');
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td><input type="text" class="edit-input time-input" value="${time}"></td>
                <td><input type="text" class="edit-input room-input" value="${roomStr}"></td>
                <td><button onclick="this.parentElement.parentElement.remove()" class="btn-danger" style="padding: 5px 10px;">X</button></td>
            `;
            tbody.appendChild(tr);
        }

        // ==========================================
        // MÓDULO DE BASE DE DATOS (LOCALSTORAGE)
        // ==========================================
        function getDBSchedules() {
            return JSON.parse(localStorage.getItem('cinepolis_schedules')) || [];
        }

        function saveScheduleToDB() {
            const title = document.getElementById('dayTitle').value || 'Sin Título';
            const times = document.querySelectorAll('.time-input');
            const rooms = document.querySelectorAll('.room-input');
            
            let currentData = [];
            for (let i = 0; i < times.length; i++) {
                if (times[i].value.trim() !== "" && rooms[i].value.trim() !== "") {
                    currentData.push({ displayTime: times[i].value, roomStr: rooms[i].value });
                }
            }

            if(currentData.length === 0) {
                alert("La tabla está vacía. No hay nada que guardar.");
                return;
            }

            const newRecord = {
                id: Date.now(),
                date: new Date().toLocaleDateString() + ' ' + new Date().toLocaleTimeString(),
                title: title,
                data: currentData
            };

            let db = getDBSchedules();
            db.unshift(newRecord); // Guardar al inicio de la lista
            localStorage.setItem('cinepolis_schedules', JSON.stringify(db));
            
            alert("Horario guardado en la base de datos.");
            renderSavedSchedules();
        }

        function renderSavedSchedules() {
            const db = getDBSchedules();
            const list = document.getElementById('savedSchedulesList');
            
            if (db.length === 0) {
                list.innerHTML = '<li>No hay horarios guardados en el inventario.</li>';
                return;
            }

            list.innerHTML = '';
            db.forEach(record => {
                const li = document.createElement('li');
                li.className = 'db-item';
                li.innerHTML = `
                    <div>
                        <strong>${record.title}</strong><br>
                        <small style="color: #666;">Guardado: ${record.date} | ${record.data.length} funciones</small>
                    </div>
                    <div style="display: flex; gap: 5px;">
                        <button onclick="loadSchedule(${record.id})">Cargar y Editar</button>
                        <button onclick="deleteSchedule(${record.id})" class="btn-danger">Borrar</button>
                    </div>
                `;
                list.appendChild(li);
            });
        }

        function loadSchedule(id) {
            const db = getDBSchedules();
            const record = db.find(r => r.id === id);
            
            if (record) {
                document.getElementById('dayTitle').value = record.title;
                document.getElementById('tableBody').innerHTML = '';
                
                record.data.forEach(d => addRow(d.displayTime, d.roomStr));
                
                document.getElementById('editorTitle').innerText = "Vista Previa (Editando Horario Guardado)";
                document.getElementById('editorSection').style.display = 'block';
                window.scrollTo({ top: document.getElementById('editorSection').offsetTop, behavior: 'smooth' });
            }
        }

        function deleteSchedule(id) {
            if(confirm("¿Estás seguro de eliminar este horario de la base de datos?")) {
                let db = getDBSchedules();
                db = db.filter(r => r.id !== id);
                localStorage.setItem('cinepolis_schedules', JSON.stringify(db));
                renderSavedSchedules();
            }
        }

        // ==========================================
        // MÓDULO DE IMPRESIÓN PDF
        // ==========================================
        function generatePDF() {
            const times = document.querySelectorAll('.time-input');
            const rooms = document.querySelectorAll('.room-input');
            
            let validData = [];
            for (let i = 0; i < times.length; i++) {
                if (times[i].value.trim() !== "" && rooms[i].value.trim() !== "") {
                    validData.push({ displayTime: times[i].value, roomStr: rooms[i].value });
                }
            }

            if(validData.length === 0) {
                alert("No hay datos válidos para imprimir.");
                return;
            }

            const { jsPDF } = window.jspdf;
            const doc = new jsPDF({ orientation: 'l', unit: 'mm', format: 'letter' });
            const title = document.getElementById('dayTitle').value || 'MARTES :)';
            
            const col1W = 35; 
            const col2W = 16; 
            const subW = col1W + col2W; 
            const gap = 3; 
            const totalW = subW + gap + subW; 

            function drawBlock(startX, blockData) {
                let maxRows = Math.ceil(blockData.length / 2);
                if (maxRows < 15) maxRows = 15; 
                
                let rowHeight = 5.5; 
                let fontSize = 10;
                
                if (maxRows > 32) {
                    rowHeight = 180 / maxRows; 
                    if(rowHeight < 4.5) fontSize = 8; 
                }

                const subCol1 = [];
                const subCol2 = [];
                for(let i=0; i < maxRows; i++) {
                    subCol1.push(blockData[i] || {displayTime: '', roomStr: ''});
                    subCol2.push(blockData[i + maxRows] || {displayTime: '', roomStr: ''});
                }

                const currentY = 12;

                doc.setLineWidth(0.4);
                doc.line(startX + 8, currentY, startX + totalW - 8, currentY); 
                doc.line(startX, currentY + 6, startX + totalW, currentY + 6); 
                doc.line(startX + 8, currentY, startX, currentY + 6); 
                doc.line(startX + totalW - 8, currentY, startX + totalW, currentY + 6); 

                doc.setFont("helvetica", "normal");
                doc.setFontSize(10);
                doc.text(`<3       ${title}`, startX + (totalW / 2), currentY + 4.2, { align: "center" });

                const startY = currentY + 8; 

                function drawSubCol(x, items) {
                    doc.setLineWidth(0.2); 
                    
                    for (let i = 0; i < items.length; i++) {
                        let y = startY + (i * rowHeight);
                        doc.rect(x, y, col1W, rowHeight);
                        doc.rect(x + col1W, y, col2W, rowHeight);

                        if (items[i].displayTime !== '') {
                            doc.setFont("helvetica", "normal");
                            doc.setFontSize(fontSize);
                            doc.text(items[i].displayTime, x + 2, y + (rowHeight * 0.75));
                            
                            doc.setFont("helvetica", "bold");
                            doc.text(items[i].roomStr.toString(), x + col1W + (col2W / 2), y + (rowHeight * 0.75), { align: "center" });
                        }
                    }

                    const h = items.length * rowHeight;
                    const corner = 3.5; 

                    doc.setLineWidth(0.8); 
                    doc.line(x, startY, x + subW, startY); 
                    doc.line(x, startY, x, startY + h); 
                    doc.line(x, startY + h, x + subW - corner, startY + h); 
                    doc.line(x + subW, startY, x + subW, startY + h - corner); 
                    doc.line(x + subW - corner, startY + h, x + subW, startY + h - corner);

                    doc.setLineWidth(0.2);
                    doc.line(x + subW - corner, startY + h, x + subW - corner, startY + h - corner);
                    doc.line(x + subW - corner, startY + h - corner, x + subW, startY + h - corner);
                }

                drawSubCol(startX, subCol1);
                drawSubCol(startX + subW + gap, subCol2);
            }

            drawBlock(20, validData);  
            drawBlock(155, validData); 

            doc.save("horarios_operativos_cine.pdf");
        }
    </script>
</body>
</html>
