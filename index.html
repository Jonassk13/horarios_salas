<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Cierres de Salas (Diseño Exacto)</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }
        .card {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        h1, h2 { color: #0056b3; font-size: 22px; margin-top: 0; }
        .control-group {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            background: #f8f9fa;
            padding: 15px;
            border-radius: 6px;
            border: 1px solid #ddd;
        }
        .control-item {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-width: 160px;
        }
        label { font-weight: bold; margin-bottom: 5px; font-size: 13px; }
        input, select {
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
            background: #fff;
        }
        button {
            background-color: #0056b3;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
            transition: 0.2s;
        }
        button:hover { background-color: #004494; }
        .btn-print { background-color: #28a745; width: 100%; margin-top: 10px;}
        .btn-print:hover { background-color: #218838; }
        #status { margin-top: 10px; font-weight: bold; color: #d9534f; }
        
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 6px;
            text-align: center;
        }
        th { background-color: #e9ecef; }
        input.edit-input {
            width: 100%;
            border: none;
            background: transparent;
            font-size: 14px;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Generador de Horarios Exactos (Excel)</h1>
        
        <div class="control-group">
            <div class="control-item" style="flex: 100%;">
                <label>1. Carga el archivo de Excel</label>
                <input type="file" id="excelInput" accept=".xlsx, .xls">
            </div>
            <div class="control-item">
                <label>Título del día</label>
                <input type="text" id="dayTitle" value="MARTES :)" placeholder="Ej. MARTES :)">
            </div>
            <div class="control-item">
                <label>Tomar horario de:</label>
                <select id="timeField">
                    <option value="CREDITS_TIME">Inicio de Créditos</option>
                    <option value="END_TIME">Fin de Función</option>
                </select>
            </div>
            <div class="control-item">
                <label>Filtrar desde la hora:</label>
                <input type="time" id="startTimeFilter" value="15:30">
            </div>
            <div class="control-item">
                <label>Ajuste tiempo (Min)</label>
                <input type="number" id="timeOffset" value="0" placeholder="Ej. 10">
            </div>
            <div class="control-item">
                <label>Desde Sala</label>
                <input type="number" id="minRoom" value="1" min="1" max="16">
            </div>
        </div>

        <button onclick="processExcel()">Extraer Horarios</button>
        <div id="status"></div>
    </div>

    <div class="card" id="editorSection" style="display: none;">
        <h2>2. Vista Previa</h2>
        <p style="font-size: 13px; color: #666;">El PDF final imprimirá dos copias idénticas en la misma hoja (cada una con el día completo dividido en dos columnas exactas).</p>
        
        <table id="dataTable">
            <thead>
                <tr>
                    <th>Hora</th>
                    <th>Sala</th>
                    <th>Acción</th>
                </tr>
            </thead>
            <tbody id="tableBody">
            </tbody>
        </table>
        
        <button onclick="addRow('', '')" style="margin-top: 10px;">+ Agregar Fila Manual</button>
        <button onclick="generatePDF()" class="btn-print">Imprimir Formato Doble (PDF)</button>
    </div>

    <script>
        function processExcel() {
            const input = document.getElementById('excelInput');
            const timeField = document.getElementById('timeField').value;
            const offsetMinutes = parseInt(document.getElementById('timeOffset').value) || 0;
            const startTimeStr = document.getElementById('startTimeFilter').value; 
            const statusDiv = document.getElementById('status');

            if (!input.files || input.files.length === 0) {
                alert("Por favor selecciona tu archivo de Excel.");
                return;
            }

            let minStartMinutes = 0;
            if (startTimeStr) {
                let parts = startTimeStr.split(':');
                minStartMinutes = parseInt(parts[0]) * 60 + parseInt(parts[1]);
            }

            statusDiv.innerText = "Procesando...";
            const file = input.files[0];
            const reader = new FileReader();

            reader.onload = function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, {type: 'array', cellDates: true});
                    const sheetName = workbook.SheetNames[0];
                    const worksheet = workbook.Sheets[sheetName];
                    const json = XLSX.utils.sheet_to_json(worksheet);
                    
                    let processedData = [];

                    json.forEach(row => {
                        let auditorium = row['AUDITORIUM'];
                        let timeVal = row[timeField];

                        if (auditorium && timeVal) {
                            let roomMatch = String(auditorium).match(/\d+/);
                            let roomNum = roomMatch ? roomMatch[0] : auditorium;
                            let timeObj = modifyTime(timeVal, offsetMinutes);
                            
                            if (timeObj) {
                                // Aplicar el filtro de hora (Las madrugadas siempre pasan porque valen +1440 mins)
                                if (timeObj.sortValue >= minStartMinutes) {
                                    processedData.push({
                                        displayTime: timeObj.display,
                                        sortValue: timeObj.sortValue,
                                        room: roomNum
                                    });
                                }
                            }
                        }
                    });

                    if (processedData.length === 0) {
                        statusDiv.innerText = `No se encontraron datos después de las ${startTimeStr}.`;
                        return;
                    }

                    processedData.sort((a, b) => a.sortValue - b.sortValue);
                    document.getElementById('tableBody').innerHTML = '';
                    processedData.forEach(d => {
                        addRow(d.displayTime, d.room);
                    });

                    statusDiv.innerText = "¡Datos extraídos y filtrados con éxito!";
                    document.getElementById('editorSection').style.display = 'block';

                } catch (error) {
                    console.error(error);
                    statusDiv.innerText = "Hubo un error al leer el archivo Excel.";
                }
            };
            reader.readAsArrayBuffer(file);
        }

        function modifyTime(timeVal, offsetMinutes) {
            let date = (timeVal instanceof Date) ? timeVal : new Date(timeVal);
            if (isNaN(date.getTime())) return null; 
            
            date.setMinutes(date.getMinutes() + offsetMinutes);

            let hours = date.getHours();
            let minutes = date.getMinutes();
            let sortValue = (hours >= 0 && hours <= 3) ? hours + 24 : hours;
            sortValue = sortValue * 60 + minutes;

            const ampm = hours >= 12 ? 'PM' : 'AM';
            let formattedHours = hours % 12;
            formattedHours = formattedHours ? formattedHours : 12; 
            let formattedMinutes = minutes < 10 ? '0' + minutes : minutes;
            
            return {
                display: `${formattedHours}:${formattedMinutes} ${ampm}`,
                sortValue: sortValue
            };
        }

        function addRow(time, room) {
            const tbody = document.getElementById('tableBody');
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td><input type="text" class="edit-input time-input" value="${time}"></td>
                <td><input type="number" class="edit-input room-input" value="${room}"></td>
                <td><button onclick="this.parentElement.parentElement.remove()" style="background-color: #dc3545; padding: 5px 10px;">X</button></td>
            `;
            tbody.appendChild(tr);
        }

        function generatePDF() {
            const minRoom = parseInt(document.getElementById('minRoom').value) || 1;
            const times = document.querySelectorAll('.time-input');
            const rooms = document.querySelectorAll('.room-input');
            
            let validData = [];
            for (let i = 0; i < times.length; i++) {
                let roomNum = parseInt(rooms[i].value);
                if (times[i].value.trim() !== "" && !isNaN(roomNum) && roomNum >= minRoom) {
                    validData.push([times[i].value, roomNum]);
                }
            }

            if(validData.length === 0) {
                alert("No hay datos válidos para imprimir.");
                return;
            }

            const { jsPDF } = window.jspdf;
            // Hoja tamaño Carta en formato Horizontal (Landscape)
            const doc = new jsPDF({ orientation: 'l', unit: 'mm', format: 'letter' });
            const title = document.getElementById('dayTitle').value || 'MARTES :)';
            
            // Medidas de dibujo exactas
            const col1W = 28;
            const col2W = 14;
            const subW = col1W + col2W; // 42mm por sub-columna
            const gap = 3; // 3mm de espacio entre sub-columnas
            const totalW = subW + gap + subW; // 87mm de ancho total por bloque

            function drawBlock(startX, blockData) {
                // Aseguramos un mínimo de 34 filas para que el cuadro llegue hasta abajo (como la foto)
                let maxRows = Math.max(34, Math.ceil(blockData.length / 2));
                
                // Sistema Anti-Desbordamiento: Si hay demasiados datos, encogemos las filas
                let rowHeight = 5.5; 
                let fontSize = 10;
                if (maxRows > 34) {
                    rowHeight = 185 / maxRows; // 185mm es el espacio máximo seguro vertical
                    if(rowHeight < 4.5) fontSize = 8; // Achicamos letra si las filas son muy delgadas
                }

                // Dividir el día completo en dos sub-columnas para este bloque
                const subCol1 = [];
                const subCol2 = [];
                for(let i=0; i < maxRows; i++) {
                    subCol1.push(blockData[i] || {displayTime: '', room: ''});
                    subCol2.push(blockData[i + maxRows] || {displayTime: '', room: ''});
                }

                const currentY = 12;

                // 1. Dibujar el Trapecio (Encabezado)
                doc.setLineWidth(0.4);
                doc.line(startX + 8, currentY, startX + totalW - 8, currentY); // Línea Arriba
                doc.line(startX, currentY + 6, startX + totalW, currentY + 6); // Línea Abajo
                doc.line(startX + 8, currentY, startX, currentY + 6); // Diagonal Izquierda
                doc.line(startX + totalW - 8, currentY, startX + totalW, currentY + 6); // Diagonal Derecha

                doc.setFont("helvetica", "normal");
                doc.setFontSize(10);
                doc.text(`<3       ${title}`, startX + (totalW / 2), currentY + 4.2, { align: "center" });

                const startY = currentY + 8; // Inicio de las tablas

                // 2. Función para dibujar cada sub-columna
                function drawSubCol(x, items) {
                    doc.setLineWidth(0.2); // Líneas delgadas para la cuadrícula interna
                    
                    for (let i = 0; i < items.length; i++) {
                        let y = startY + (i * rowHeight);
                        // Celdas
                        doc.rect(x, y, col1W, rowHeight);
                        doc.rect(x + col1W, y, col2W, rowHeight);

                        // Textos
                        if (items[i].displayTime !== '') {
                            doc.setFont("helvetica", "normal");
                            doc.setFontSize(fontSize);
                            // Ajuste matemático para centrar el texto verticalmente
                            doc.text(items[i].displayTime, x + 2, y + (rowHeight * 0.75));
                            doc.setFont("helvetica", "bold");
                            doc.text(items[i].room.toString(), x + col1W + (col2W / 2), y + (rowHeight * 0.75), { align: "center" });
                        }
                    }

                    // 3. Dibujar Borde Exterior Grueso y el "Doblez"
                    const h = items.length * rowHeight;
                    const corner = 3.5; // Tamaño de la esquina doblada

                    doc.setLineWidth(0.8); // Borde Grueso
                    doc.line(x, startY, x + subW, startY); // Arriba
                    doc.line(x, startY, x, startY + h); // Izquierda
                    doc.line(x, startY + h, x + subW - corner, startY + h); // Abajo (cortada)
                    doc.line(x + subW, startY, x + subW, startY + h - corner); // Derecha (cortada)

                    // Línea gruesa diagonal del doblez
                    doc.line(x + subW - corner, startY + h, x + subW, startY + h - corner);

                    // Líneas delgadas internas del doblez
                    doc.setLineWidth(0.2);
                    doc.line(x + subW - corner, startY + h, x + subW - corner, startY + h - corner);
                    doc.line(x + subW - corner, startY + h - corner, x + subW, startY + h - corner);
                }

                // Dibujar Sub-Columna Izquierda y Derecha de este bloque
                drawSubCol(startX, subCol1);
                drawSubCol(startX + subW + gap, subCol2);
            }

            // MÁGIA FINAL: Dibujamos dos bloques idénticos (cada uno con la info de todo el día)
            // Coordenadas calculadas para centrar perfectamente ambas mitades en tamaño Carta
            drawBlock(26, validData);  // Mitad Izquierda
            drawBlock(166, validData); // Mitad Derecha

            doc.save("horarios_exactos_final.pdf");
        }
    </script>
</body>
</html>
