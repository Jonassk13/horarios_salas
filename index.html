<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Cierres de Salas (Versión Excel)</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }
        .card {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        h1, h2 { color: #0056b3; font-size: 24px; margin-top: 0; }
        .control-group {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            background: #f8f9fa;
            padding: 15px;
            border-radius: 6px;
            border: 1px solid #ddd;
        }
        .control-item {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-width: 180px;
        }
        label { font-weight: bold; margin-bottom: 5px; font-size: 14px; }
        input, select {
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 15px;
            background: #fff;
        }
        button {
            background-color: #0056b3;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: 0.2s;
        }
        button:hover { background-color: #004494; }
        .btn-print { background-color: #28a745; width: 100%; margin-top: 10px;}
        .btn-print:hover { background-color: #218838; }
        #status { margin-top: 10px; font-weight: bold; color: #d9534f; }
        
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 6px;
            text-align: center;
        }
        th { background-color: #e9ecef; }
        input.edit-input {
            width: 100%;
            border: none;
            background: transparent;
            font-size: 15px;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Generador de Horarios desde Excel</h1>
        
        <div class="control-group">
            <div class="control-item" style="flex: 100%;">
                <label>1. Carga el archivo de Excel del sistema</label>
                <input type="file" id="excelInput" accept=".xlsx, .xls">
            </div>
            <div class="control-item">
                <label>Título del día</label>
                <input type="text" id="dayTitle" value="MARTES :)" placeholder="Ej. MARTES :)">
            </div>
            <div class="control-item">
                <label>Tomar horario de:</label>
                <select id="timeField">
                    <option value="CREDITS_TIME">Inicio de Créditos</option>
                    <option value="END_TIME">Fin de Función</option>
                </select>
            </div>
            <div class="control-item">
                <label>Ajuste de tiempo (Minutos)</label>
                <input type="number" id="timeOffset" value="0" placeholder="Ej. 10 o -5">
            </div>
            <div class="control-item">
                <label>Imprimir desde Sala</label>
                <input type="number" id="minRoom" value="1" min="1" max="16">
            </div>
        </div>

        <button onclick="processExcel()">Extraer Horarios de Excel</button>
        <div id="status"></div>
    </div>

    <div class="card" id="editorSection" style="display: none;">
        <h2>2. Vista Previa</h2>
        
        <table id="dataTable">
            <thead>
                <tr>
                    <th>Hora de Salida</th>
                    <th>Sala</th>
                    <th>Acción</th>
                </tr>
            </thead>
            <tbody id="tableBody">
            </tbody>
        </table>
        
        <div style="margin-top: 15px; display: flex; gap: 10px;">
            <button onclick="addRow('', '')">+ Agregar Fila Manual</button>
        </div>
        <button onclick="generatePDF()" class="btn-print">Imprimir Formato Doble (PDF)</button>
    </div>

    <script>
        function processExcel() {
            const input = document.getElementById('excelInput');
            const timeField = document.getElementById('timeField').value;
            const offsetMinutes = parseInt(document.getElementById('timeOffset').value) || 0;
            const statusDiv = document.getElementById('status');

            if (!input.files || input.files.length === 0) {
                alert("Por favor selecciona tu archivo de Excel.");
                return;
            }

            statusDiv.innerText = "Procesando archivo...";
            const file = input.files[0];
            const reader = new FileReader();

            reader.onload = function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, {type: 'array', cellDates: true});
                    const sheetName = workbook.SheetNames[0];
                    const worksheet = workbook.Sheets[sheetName];
                    const json = XLSX.utils.sheet_to_json(worksheet);
                    
                    let processedData = [];

                    json.forEach(row => {
                        let auditorium = row['AUDITORIUM'];
                        let timeVal = row[timeField];

                        if (auditorium && timeVal) {
                            let roomMatch = String(auditorium).match(/\d+/);
                            let roomNum = roomMatch ? roomMatch[0] : auditorium;
                            let timeObj = modifyTime(timeVal, offsetMinutes);
                            
                            if (timeObj) {
                                processedData.push({
                                    displayTime: timeObj.display,
                                    sortValue: timeObj.sortValue,
                                    room: roomNum
                                });
                            }
                        }
                    });

                    if (processedData.length === 0) {
                        statusDiv.innerText = `No se encontraron datos en la columna '${timeField}'.`;
                        return;
                    }

                    processedData.sort((a, b) => a.sortValue - b.sortValue);
                    document.getElementById('tableBody').innerHTML = '';
                    processedData.forEach(d => {
                        addRow(d.displayTime, d.room);
                    });

                    statusDiv.innerText = "¡Datos extraídos con éxito!";
                    document.getElementById('editorSection').style.display = 'block';

                } catch (error) {
                    console.error(error);
                    statusDiv.innerText = "Hubo un error al leer el archivo Excel.";
                }
            };
            reader.readAsArrayBuffer(file);
        }

        function modifyTime(timeVal, offsetMinutes) {
            let date = (timeVal instanceof Date) ? timeVal : new Date(timeVal);
            if (isNaN(date.getTime())) return null; 
            
            date.setMinutes(date.getMinutes() + offsetMinutes);

            let hours = date.getHours();
            let minutes = date.getMinutes();
            let sortValue = (hours >= 0 && hours <= 3) ? hours + 24 : hours;
            sortValue = sortValue * 60 + minutes;

            const ampm = hours >= 12 ? 'PM' : 'AM';
            let formattedHours = hours % 12;
            formattedHours = formattedHours ? formattedHours : 12; 
            let formattedMinutes = minutes < 10 ? '0' + minutes : minutes;
            
            return {
                display: `${formattedHours}:${formattedMinutes} ${ampm}`,
                sortValue: sortValue
            };
        }

        function addRow(time, room) {
            const tbody = document.getElementById('tableBody');
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td><input type="text" class="edit-input time-input" value="${time}"></td>
                <td><input type="number" class="edit-input room-input" value="${room}"></td>
                <td><button onclick="this.parentElement.parentElement.remove()" style="background-color: #dc3545; padding: 5px 10px;">X</button></td>
            `;
            tbody.appendChild(tr);
        }

        function generatePDF() {
            const minRoom = parseInt(document.getElementById('minRoom').value) || 1;
            const times = document.querySelectorAll('.time-input');
            const rooms = document.querySelectorAll('.room-input');
            
            let validData = [];
            for (let i = 0; i < times.length; i++) {
                let roomNum = parseInt(rooms[i].value);
                if (times[i].value.trim() !== "" && !isNaN(roomNum) && roomNum >= minRoom) {
                    validData.push([times[i].value, roomNum]);
                }
            }

            if(validData.length === 0) {
                alert("No hay datos válidos para imprimir.");
                return;
            }

            const { jsPDF } = window.jspdf;
            const doc = new jsPDF({ orientation: 'l', unit: 'mm', format: 'letter' });
            const title = document.getElementById('dayTitle').value || 'MARTES :)';
            
            const half = Math.ceil(validData.length / 2);
            const dataCol1 = validData.slice(0, half);
            const dataCol2 = validData.slice(half);

            // Ajustes extremos de diseño para replicar la imagen original
            const tableStyles = {
                theme: 'grid',
                head: [], 
                styles: {
                    font: 'helvetica',
                    fontSize: 10,
                    textColor: [0, 0, 0],
                    lineColor: [0, 0, 0],
                    lineWidth: 0.3,
                    valign: 'middle',
                    // Mínimo padding para evitar que salte de página
                    cellPadding: { top: 1.2, right: 2, bottom: 1.2, left: 2 }
                },
                columnStyles: {
                    0: { halign: 'left', cellWidth: 32 },
                    1: { halign: 'right', cellWidth: 16, fontStyle: 'bold' } 
                },
                margin: { bottom: 2 } // Evita saltos de página prematuros
            };

            function drawBlock(startX) {
                doc.setLineWidth(0.5);
                // Dibujo del trapecio superior exactamente como la foto
                doc.line(startX + 5, 10, startX + 95, 10); // Arriba
                doc.line(startX, 16, startX + 100, 16); // Abajo
                doc.line(startX, 16, startX + 5, 10); // Diagonal izquierda
                doc.line(startX + 100, 16, startX + 95, 10); // Diagonal derecha
                
                doc.setFontSize(11);
                // Corazón en texto seguro para PDF
                doc.text(`<3       ${title}`, startX + 50, 14, { align: "center" });

                const startY = 20;

                if (dataCol1.length > 0) {
                    doc.autoTable({
                        ...tableStyles,
                        body: dataCol1,
                        startY: startY,
                        margin: { left: startX }
                    });
                    let finalY = doc.lastAutoTable.finalY;
                    drawOuterBorder(startX, startY, 48, finalY - startY);
                }

                if (dataCol2.length > 0) {
                    doc.autoTable({
                        ...tableStyles,
                        body: dataCol2,
                        startY: startY,
                        margin: { left: startX + 52 } 
                    });
                    let finalY = doc.lastAutoTable.finalY;
                    drawOuterBorder(startX + 52, startY, 48, finalY - startY);
                }
            }

            // Función para dibujar el contorno grueso y el doblez inferior derecho
            function drawOuterBorder(x, y, w, h) {
                doc.setLineWidth(0.8);
                doc.line(x, y, x + w, y); // Top
                doc.line(x, y, x, y + h); // Left
                
                const corner = 4;
                doc.line(x, y + h, x + w - corner, y + h); // Bottom short
                doc.line(x + w, y, x + w, y + h - corner); // Right short
                doc.line(x + w - corner, y + h, x + w, y + h - corner); // Diagonal cut
                
                doc.setLineWidth(0.3); // Líneas finas del doblez
                doc.line(x + w - corner, y + h, x + w - corner, y + h - corner);
                doc.line(x + w - corner, y + h - corner, x + w, y + h - corner);
            }

            drawBlock(15); 
            drawBlock(145);

            doc.save("horarios_salidas_exacto.pdf");
        }
    </script>
</body>
</html>
